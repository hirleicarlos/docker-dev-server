global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend http_in
    bind *:80
    mode http
    option httplog

    acl host_nginx hdr(host),lower -m reg (^|\.)2\.localhost(:[0-9]+)?$
    acl host_nginx hdr(host),lower -m end .localhost2

    use_backend nginx_http if host_nginx
    default_backend apache_http

backend apache_http
    mode http
    server apache web:80 check init-addr libc,none

backend nginx_http
    mode http
    server nginx nginx:80 check init-addr libc,none

frontend https_in
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl sni_nginx req.ssl_sni,lower -m reg (^|\.)2\.localhost$
    acl sni_nginx req.ssl_sni,lower -m end .localhost2

    use_backend nginx_https if sni_nginx
    default_backend apache_https

backend apache_https
    mode tcp
    server apache web:443 check init-addr libc,none

backend nginx_https
    mode tcp
    server nginx nginx:443 check init-addr libc,none
