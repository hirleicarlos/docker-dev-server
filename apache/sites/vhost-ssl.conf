<VirtualHost *:443>
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/html/%1
    ServerName sites.localhost
    ServerAlias *.localhost *.localhost1 *.1.localhost

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key

    ErrorDocument 421 "Nginx e roteado pelo docker_router. Abra https://projeto.2.localhost/."
    RewriteEngine On
    RewriteCond %{HTTP_HOST} \.2\.localhost$ [NC]
    RewriteRule ^ - [R=421,L]

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName nginx-direct-only.localhost
    ServerAlias localhost2 *.localhost2 *.2.localhost

    SSLEngine on
