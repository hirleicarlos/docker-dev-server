<VirtualHost *:80>
    ServerName localhost1
    DocumentRoot /var/www/html/joomla6

    <Directory /var/www/html/joomla6>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/html/%1
    ServerName sites.localhost
    ServerAlias *.localhost *.localhost1 *.1.localhost

    ErrorDocument 421 "Nginx e roteado pelo docker_router. Abra https://projeto.2.localhost/."
    RewriteEngine On
    RewriteCond %{HTTP_HOST} \.2\.localhost$ [NC]
    RewriteRule ^ - [R=421,L]

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName nginx-direct-only.localhost
    ServerAlias localhost2 *.localhost2 *.2.localhost

    ErrorDocument 421 "Nginx e roteado pelo docker_router. Abra https://projeto.2.localhost/."
    RewriteEngine On
    RewriteRule ^ - [R=421,L]
</VirtualHost>
