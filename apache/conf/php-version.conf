# Execucao de PHP no Apache.
#
# O Apache nao executa mais PHP internamente. O mod_php foi desabilitado na
# imagem e o Apache delega para o mesmo PHP-FPM que o Nginx usa. Assim os dois
# servidores rodam sempre a MESMA versao, para todos os projetos.
#
# "php-fpm-active" e um alias de rede compartilhado pelos dois containers
# PHP-FPM. Apenas um deles roda por vez:
#
#   php_fpm_server      PHP 8.3
#   php_fpm_84_server   PHP 8.4
#
# Este arquivo nunca precisa ser editado para trocar de versao.
# Para trocar: ./php-switch.sh 8.4   (ou 8.3)

DirectoryIndex index.php index.html index.htm

# Acompanha o max_execution_time de 3600 do php.ini.
ProxyTimeout 3600

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php-fpm-active:9000"
</FilesMatch>
